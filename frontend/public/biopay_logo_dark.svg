      <path d="M 26 70 Q 26 32 55 20"/>
      <path d="M 102 70 Q 102 45 85 38"/>
      <path d="M 108 70 Q 108 38 85 28"/>
      <path d="M 114 70 Q 114 32 85 20"/>
      <path d="M 50 100 Q 70 118 90 100"/>
      <path d="M 42 105 Q 70 128 98 105"/>
